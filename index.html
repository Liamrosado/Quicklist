<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>QuickList.com</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <header id="compras">
                <input type="image" src="imgs/link button.svg" alt="botão de voltar">
                <h1>Compras da Semana</h1> 
            </header>

            <form action="" method="get">
                <fieldset id="novo-item">
                    <input type="text" name="item" id="item" placeholder="Adicione um novo item">
                    <button type="submit" name="btn" id="enviar">Adicionar item</button>
                </fieldset>

                <div id="cadastrados">
                        <div id="item-1" class="items button">
                            <input type="checkbox" name="Pão" id="Pão">
                            <label for="Pão">Pão de Forma</label>
                            <input type="image" id="remover" name="remover" src="imgs/Frame.svg" alt="Remover">
                        </div>
                   
                        <div id="item-2" class=" items button">
                            <input type="checkbox" name="Café" id="Café">
                            <label for="Café">Café Preto</label>
                            <input type="image" id="remover" name="remover" src="imgs/Frame.svg" alt="Remover">
                        </div>

                        <div id="item-3" class="items button">
                            <input type="checkbox" name="Suco" id="Suco">
                            <label for="Suco">Suco de laranja</label>
                            <input type="image" id="remover" name="remover" src="imgs/Frame.svg" alt="Remover">
                        </div>

                        <div id="item-4" class="items button">
                            <input type="checkbox" name="Bolacha" id="Bolacha">
                            <label for="Bolacha">Bolacha</label>
                            <input type="image" id="remover" name="remover" src="imgs/Frame.svg" alt="Remover">
                        </div>
                </div>

                
                    <div id="removido" class="items desativado">
                        <div class="button">
                            <img src="imgs/warning-circle-filled.svg" alt="warning">
                            <label for="alert">O item foi removido da lista</label>
                            <input type="image" name="Delete" src="imgs/delete-small.svg" alt="Remover alerta">
                        </div>
                    </div>
            </form>

        </main>
        
        <script src="scripts.js"></script>
    </body>
</html>
